<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="680" fill="#ffffff"/>
  <text x="480" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AWS 2-Tier Architecture — Terraform + Jenkins CI/CD</text>

  <!-- Jenkins/CI box top -->
  <rect x="40" y="55" width="880" height="90" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="480" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CI/CD Pipeline</text>
  <text x="130" y="102" font-size="11" text-anchor="middle" fill="#333">GitHub Repo</text>
  <text x="130" y="118" font-size="9.5" text-anchor="middle" fill="#666">(Terraform code + Jenkinsfile)</text>
  <text x="360" y="102" font-size="11" text-anchor="middle" fill="#333">Jenkins (EC2)</text>
  <text x="360" y="118" font-size="9.5" text-anchor="middle" fill="#666">Poll SCM -&gt; Checkout -&gt; Init -&gt; Plan -&gt; Approval -&gt; Apply</text>
  <text x="620" y="102" font-size="11" text-anchor="middle" fill="#333">Terraform State Backend</text>
  <text x="620" y="118" font-size="9.5" text-anchor="middle" fill="#666">S3 (versioned) + DynamoDB (lock table)</text>
  <text x="850" y="102" font-size="11" text-anchor="middle" fill="#333">AWS Account</text>
  <text x="850" y="118" font-size="9.5" text-anchor="middle" fill="#666">Provisioned via IAM user</text>

  <line x1="200" y1="100" x2="270" y2="100" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="100" x2="520" y2="100" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="710" y1="100" x2="780" y2="100" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="480" y1="145" x2="480" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- VPC box -->
  <rect x="60" y="175" width="840" height="470" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="198" font-size="13" font-weight="bold" fill="#555">VPC: project2-vpc (10.0.0.0/16)</text>

  <!-- IGW -->
  <rect x="410" y="205" width="140" height="34" rx="6" fill="#fff3bf" stroke="#e8ab00" stroke-width="1.5"/>
  <text x="480" y="227" font-size="12" text-anchor="middle" fill="#1a1a1a">Internet Gateway</text>

  <!-- Web tier label -->
  <text x="480" y="270" font-size="12" font-weight="bold" text-anchor="middle" fill="#1971c2">Web Tier — Public Subnets</text>

  <!-- Public subnet A -->
  <rect x="120" y="282" width="330" height="110" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="285" y="302" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">public-subnet-a (AZ1) — 10.0.1.0/24</text>
  <rect x="150" y="316" width="270" height="56" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="285" y="336" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">EC2: web-server-a</text>
  <text x="285" y="352" font-size="10" text-anchor="middle" fill="#333">Apache/Nginx, t2.micro</text>
  <text x="285" y="366" font-size="9.5" text-anchor="middle" fill="#666">SG: web-sg (80, 22)</text>

  <!-- Public subnet B -->
  <rect x="510" y="282" width="330" height="110" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="675" y="302" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">public-subnet-b (AZ2) — 10.0.2.0/24</text>
  <rect x="540" y="316" width="270" height="56" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="675" y="336" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">EC2: web-server-b</text>
  <text x="675" y="352" font-size="10" text-anchor="middle" fill="#333">Apache/Nginx, t2.micro</text>
  <text x="675" y="366" font-size="9.5" text-anchor="middle" fill="#666">SG: web-sg (80, 22)</text>

  <line x1="480" y1="239" x2="285" y2="282" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="480" y1="239" x2="675" y2="282" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- DB tier label -->
  <text x="480" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#c2255c">Database Tier — Private Subnets</text>

  <!-- Private subnet A -->
  <rect x="120" y="437" width="330" height="110" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="285" y="457" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">private-subnet-a (AZ1) — 10.0.3.0/24</text>

  <!-- Private subnet B -->
  <rect x="510" y="437" width="330" height="110" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
  <text x="675" y="457" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">private-subnet-b (AZ2) — 10.0.4.0/24</text>

  <!-- RDS spanning both -->
  <rect x="330" y="475" width="300" height="60" rx="6" fill="#ffffff" stroke="#c2255c" stroke-width="1.5"/>
  <text x="480" y="497" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RDS MySQL (Multi-AZ)</text>
  <text x="480" y="512" font-size="9.5" text-anchor="middle" fill="#333">db_subnet_group: private_a + private_b</text>
  <text x="480" y="526" font-size="9.5" text-anchor="middle" fill="#666">SG: rds-sg (3306, from web-sg only)</text>

  <line x1="285" y1="372" x2="440" y2="475" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <line x1="675" y1="372" x2="520" y2="475" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>

  <!-- Route tables note -->
  <rect x="120" y="565" width="720" height="60" rx="6" fill="#ffffff" stroke="#888" stroke-width="1"/>
  <text x="480" y="585" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333">Route Tables</text>
  <text x="480" y="600" font-size="10" text-anchor="middle" fill="#333">public-rt: 0.0.0.0/0 -&gt; Internet Gateway (associated with public subnets)</text>
  <text x="480" y="614" font-size="10" text-anchor="middle" fill="#333">private-rt: no internet route (associated with private subnets)</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
